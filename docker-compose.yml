version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ganji-postgres
    environment:
      POSTGRES_DB: ganji_protocol
      POSTGRES_USER: ganji
      POSTGRES_PASSWORD: ganji
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganji"]
      interval: 10s
      timeout: 5s
      retries: 5

  ganji-service:
    build:
      context: ./go-service
      dockerfile: Dockerfile
    container_name: ganji-service
    environment:
      DATABASE_URL: postgres://ganji:ganji@postgres:5432/ganji_protocol
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
